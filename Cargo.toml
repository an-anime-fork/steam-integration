[package]
name = "steamintegration"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
tracing = "0.1"

sysinfo = "0.37"
anyhow = { version = "1.0", features = ["backtrace"] }
cached = { version = "0.56", features = ["proc_macro"] }

# Locate steam tooling and encapsulate the information in appropriate data structures
steamlocate = { package = "steamlocate",  version = "2.0" }
enum-ordinalize = { version = "4.3", optional = true }

serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }

gfxinfo = "0.1.2"

wincompatlib = { version = "0.7", features = ["all"], optional = true }
lazy_static = { version = "1.5", optional = true }

[features]
integrations = []
components = ["dep:wincompatlib", "dep:lazy_static"]
config = ["dep:serde", "dep:serde_json", "dep:enum-ordinalize"]

all = [
    "integrations",
    "config",
    "components"
]

default = [ "all" ]